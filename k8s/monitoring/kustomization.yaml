apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - prometheus.yaml
  - pushgateway.yaml
  - loki.yaml
  - alloy.yaml
  - grafana.yaml
configMapGenerator:
  - name: prometheus-config
    files:
      - config/prometheus.yml
      - config/alerts.yml
  - name: loki-config
    files:
      - config/loki.yml
  - name: alloy-config
    files:
      - config/config.alloy
  - name: grafana-datasources
    files:
      - config/datasources.yml
  - name: grafana-dashboard-provider
    files:
      - config/dashboards.yml
  - name: grafana-dashboards
    files:
      - dashboards/order-manager.json
