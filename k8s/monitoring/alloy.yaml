apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  labels: {app: alloy}
spec:
  replicas: 1
  selector:
    matchLabels: {app: alloy}
  template:
    metadata:
      labels: {app: alloy}
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.9.1
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/tmp/alloy
            - --server.http.listen-addr=0.0.0.0:12345
          ports:
            - containerPort: 12345
          readinessProbe:
            httpGet: {path: /-/ready, port: 12345}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 300m, memory: 384Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/alloy}
      volumes:
        - name: config
          configMap: {name: alloy-config}
