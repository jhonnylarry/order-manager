# ============================================================
# Perfil "docker" (SPRING_PROFILES_ACTIVE=docker)
# Reemplaza los valores de application.properties cuando la
# aplicación corre en contenedor: PostgreSQL en lugar de H2.
# Las credenciales llegan por variables de entorno, nunca en el código.
# ============================================================

# ============================================================
# Base de datos PostgreSQL (persistente)
# ============================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:orderdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# ============================================================
# JPA / Hibernate
# "update" conserva los datos entre reinicios (create-drop los borraba)
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ============================================================
# Consola H2 deshabilitada para evitar conflictos con PostgreSQL
# ============================================================
spring.h2.console.enabled=false

# ============================================================
# Actuator
# ============================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ============================================================
# Servidor
# ============================================================
server.port=8098
