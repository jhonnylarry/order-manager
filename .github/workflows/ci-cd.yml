# ============================================================
# Pipeline CI/CD - Order Manager
#   1. test      pruebas unitarias + cobertura mínima (JaCoCo)
#   2. security  análisis estático en SonarCloud con quality gate
#   3. build     imagen Docker con trazabilidad al commit
#   4. deploy    despliegue automático en Kubernetes con monitoreo verificado
# Cada etapa depende de la anterior: si una falla, el pipeline se detiene.
# ============================================================
name: CI/CD Pipeline - Order Manager

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  JAVA_VERSION: "17"
  IMAGE_NAME: order-manager
  APP_PORT: "8098"
  MIN_COVERAGE: "70"
  SCANNER_JAVA_VERSION: "21"
  SONAR_ORGANIZATION: jhonnylarry
  SONAR_PROJECT_KEY: jhonnylarry_order-manager

jobs:
  # ----------------------------------------------------------
  # 1. Pruebas y cobertura
  # ----------------------------------------------------------
  test:
    name: Pruebas y cobertura
    runs-on: ubuntu-latest
    outputs:
      cobertura: ${{ steps.cobertura.outputs.total }}
      pruebas: ${{ steps.cobertura.outputs.pruebas }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Ejecutar pruebas y generar reporte JaCoCo
        run: mvn -B clean verify

      - name: Verificar cobertura mínima
        id: cobertura
        run: |
          python3 - <<'EOF'
          import csv, glob, os, sys
          import xml.etree.ElementTree as ET
          minimo = float(os.environ["MIN_COVERAGE"])
          filas = list(csv.DictReader(open("target/site/jacoco/jacoco.csv")))
          cubiertas = sum(int(f["INSTRUCTION_COVERED"]) for f in filas)
          perdidas = sum(int(f["INSTRUCTION_MISSED"]) for f in filas)
          total = 100 * cubiertas / (cubiertas + perdidas)
          resumen = f"Cobertura total de instrucciones: {total:.1f}% (mínimo exigido: {minimo:.0f}%)"
          print(resumen)
          pruebas = sum(int(ET.parse(r).getroot().get("tests"))
                        for r in glob.glob("target/surefire-reports/TEST-*.xml"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as salida:
              salida.write(f"total={total:.1f}\npruebas={pruebas}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
              s.write(f"### Cobertura de pruebas\n{resumen}\n")
          sys.exit(0 if total >= minimo else 1)
          EOF

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  # ----------------------------------------------------------
  # 2. Seguridad y calidad de código
  # ----------------------------------------------------------
  security:
    name: Análisis de seguridad (SonarCloud)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # El scanner de SonarCloud exige Java 21 o superior para ejecutarse.
      # El código sigue compilándose para Java 17 (release 17 en el pom).
      - name: Configurar JDK ${{ env.SCANNER_JAVA_VERSION }} para el scanner
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.SCANNER_JAVA_VERSION }}
          cache: maven

      - name: Analizar con SonarCloud (bloquea si falla el quality gate)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization="${SONAR_ORGANIZATION}" \
            -Dsonar.projectKey="${SONAR_PROJECT_KEY}" \
            -Dsonar.qualitygate.wait=true

  # ----------------------------------------------------------
  # 3. Construcción de la imagen Docker
  # ----------------------------------------------------------
  build:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Construir imagen con etiquetas de trazabilidad
        run: |
          docker build \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            -t "${IMAGE_NAME}:1.0.0" \
            -t "${IMAGE_NAME}:${{ github.sha }}" .

      - name: Verificar que la imagen existe
        run: docker image ls "${IMAGE_NAME}"

      - name: Guardar imagen comprimida
        run: docker save "${IMAGE_NAME}:1.0.0" | gzip > "${IMAGE_NAME}.tar.gz"

      - name: Publicar imagen como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: ${{ env.IMAGE_NAME }}.tar.gz
          retention-days: 7

  # ----------------------------------------------------------
  # 4. Despliegue automático en Kubernetes (clúster efímero kind)
  # ----------------------------------------------------------
  deploy:
    name: Desplegar en Kubernetes y verificar monitoreo
    runs-on: ubuntu-latest
    needs: [test, build]
    environment: ${{ github.event_name == 'pull_request' && 'preview' || (github.ref_name == 'main' && 'production' || 'staging') }}
    env:
      ENTORNO: ${{ github.event_name == 'pull_request' && 'preview' || (github.ref_name == 'main' && 'production' || 'staging') }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Descargar imagen construida
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Crear clúster de Kubernetes
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: order-manager

      - name: Cargar la imagen en el clúster
        run: |
          gunzip -c "${IMAGE_NAME}.tar.gz" | docker load
          docker tag "${IMAGE_NAME}:1.0.0" "${IMAGE_NAME}:${GITHUB_SHA}"
          kind load docker-image "${IMAGE_NAME}:${GITHUB_SHA}" --name order-manager

      - name: Desplegar aplicación y monitoreo
        env:
          COMMIT: ${{ github.sha }}
          COVERAGE: ${{ needs.test.outputs.cobertura }}
          TESTS: ${{ needs.test.outputs.pruebas }}
        run: COMMIT="${COMMIT:0:7}" scripts/desplegar-k8s.sh "${GITHUB_SHA}"

      - name: Verificar métricas, logs, alertas y dashboard
        run: scripts/verificar-observabilidad.sh

      - name: Registrar trazabilidad del despliegue
        run: |
          {
            echo "### Despliegue en Kubernetes"
            echo "- Entorno: ${ENTORNO}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Imagen: ${IMAGE_NAME}:${GITHUB_SHA}"
            echo "- Ejecución: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '```'
            cat evidencias/metricas.txt
            echo
            cat evidencias/kubernetes.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mostrar diagnóstico si el despliegue falla
        if: failure()
        run: |
          kubectl get pods -A
          kubectl get events -A --sort-by=.lastTimestamp | tail -40
          for ns in order-manager monitoring; do
            for d in $(kubectl -n "$ns" get deployments -o name); do
              echo "=== $ns $d ==="
              kubectl -n "$ns" logs "$d" --all-containers --tail=60 || true
            done
          done

      - name: Publicar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-observabilidad
          path: evidencias/
          if-no-files-found: ignore
